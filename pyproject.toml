[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-academy-downloader"
version = "3.0.0"
description = "Nexora Academy Downloader — captura offline de sites"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3",
  "beautifulsoup4==4.15.0",
  "requests==2.34.2",
  "urllib3==2.7.0",
  "playwright==1.62.0",
  "gunicorn==23.0.0",
]
